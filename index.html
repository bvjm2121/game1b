<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>礦坑夢想家｜小小理財冒險</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');
:root{--ink:#163043;--cream:#fff9dc;--gold:#ffc83d;--orange:#f27c38;--teal:#147a78;--mine:#12374c;--green:#72bb62}*{box-sizing:border-box}body{margin:0;background:#102f42;color:var(--ink);font-family:'Noto Sans TC',sans-serif;min-height:100vh}.game{max-width:1180px;margin:auto;min-height:100vh;background:var(--cream);overflow:hidden;position:relative}.top{height:76px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;background:#fff5c2;border-bottom:4px solid #e4b63f}.brand{font:700 25px Fredoka,'Noto Sans TC';color:#174155;letter-spacing:.5px}.brand span{color:#e66e32}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:white;border:2px solid #ecd07a;border-radius:13px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 #dfbd5a}.layout{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:19px}.mapwrap{position:relative;border:6px solid #25475a;border-radius:20px;background:#71c5df;overflow:hidden;box-shadow:inset 0 0 0 4px #b9eaf4;min-height:560px}.map{height:560px;position:relative;background:linear-gradient(#82d4e9 0 31%,#72be64 31% 58%,#5d944f 58%);overflow:hidden}.cloud{position:absolute;color:#e8fbff;font-size:60px;opacity:.86}.mountain{position:absolute;bottom:245px;width:0;height:0;border-left:170px solid transparent;border-right:170px solid transparent;border-bottom:240px solid #47657a;filter:drop-shadow(15px 12px #315365)}.m1{left:-50px}.m2{right:-65px;transform:scale(.76);bottom:260px}.ground{position:absolute;bottom:0;width:100%;height:44%;background:repeating-linear-gradient(132deg,#9e6a38 0 24px,#86542d 25px 29px);border-top:8px solid #d7a556}.track{position:absolute;bottom:77px;left:3%;right:3%;height:17px;background:repeating-linear-gradient(90deg,#503a31 0 15px,#d7b075 16px 37px);transform:rotate(-3deg);border-radius:10px}.path{position:absolute;left:10%;right:10%;top:40%;height:70px;background:#e1c270;border:5px dashed #fff1ac;border-radius:40px;transform:rotate(-3deg)}.node{position:absolute;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;border:5px solid #fff8d7;box-shadow:0 5px 0 rgba(34,61,63,.35);cursor:pointer;transition:.2s;z-index:2}.node:hover{transform:scale(1.08)}.node.done{border-color:#8cda7d}.node.lock{filter:grayscale(.75);cursor:not-allowed}.n0{left:7%;top:48%;background:#3f9b86}.n1{left:27%;top:35%;background:#f7a944}.n2{left:48%;top:47%;background:#f17d54}.n3{left:67%;top:29%;background:#8c77ca}.n4{right:6%;top:44%;background:#f3c63d}.miner{position:absolute;z-index:3;font-size:52px;left:9%;top:57%;filter:drop-shadow(2px 4px #264c56);transition:left .6s,top .6s}.sign{position:absolute;bottom:23px;left:22px;background:#fff6cb;border:4px solid #7c4a2d;border-radius:9px;padding:8px 11px;font-weight:900;font-size:13px;transform:rotate(-2deg)}.sidebar{display:flex;flex-direction:column;gap:14px}.card{background:white;border:3px solid #efcf71;border-radius:18px;padding:16px;box-shadow:0 4px 0 #dfb94d}.card h2{font:700 20px Fredoka,'Noto Sans TC';margin:0 0 8px;color:#1f5364}.goalpic{font-size:53px;float:right;margin:-7px 0 0 8px}.progress{height:13px;border-radius:20px;background:#e7edf0;overflow:hidden;margin:11px 0 5px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f6a63d,#ffd95d);border-radius:inherit}.tip{background:#e5f5e0;border-color:#89c97a;font-size:14px;line-height:1.6}.tip b{color:#397b46}.btn{border:0;border-bottom:4px solid #a64e27;background:var(--orange);color:white;border-radius:13px;padding:12px 17px;font:700 16px 'Noto Sans TC';cursor:pointer;width:100%;margin-top:10px}.btn:hover{filter:brightness(1.08)}.btn.alt{background:#19847e;border-bottom-color:#0c5658}.overlay{position:fixed;inset:0;background:rgba(7,29,42,.7);display:grid;place-items:center;padding:16px;z-index:10}.modal{max-width:690px;width:100%;max-height:90vh;overflow:auto;background:#fffbea;border:7px solid #315564;border-radius:24px;padding:27px;box-shadow:0 15px 0 rgba(0,0,0,.25);text-align:center}.modal h1{font:700 32px Fredoka,'Noto Sans TC';margin:0 0 8px;color:#16465a}.modal p{line-height:1.75;font-size:16px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0}.choice{background:white;border:3px solid #ead58a;border-radius:17px;padding:15px 8px;cursor:pointer;font-weight:900;font-size:16px}.choice:hover{border-color:#f0833c;transform:translateY(-3px)}.choice .emoji{display:block;font-size:48px;margin-bottom:7px}.dialogue{background:#dff4fb;border:3px solid #78bad0;border-radius:15px;padding:14px;text-align:left;margin:15px 0;font-size:16px;line-height:1.65}.dialogue b{color:#04726f}.adgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;text-align:left}.ad{padding:15px;border-radius:14px;border:3px solid #e0d39a;background:white;cursor:pointer;min-height:140px}.ad:hover{border-color:#e56f38}.ad.selected{background:#fff0df;border-color:#e76930}.ad h3{margin:0 0 7px;font-size:17px}.ad p{font-size:14px;margin:0;color:#405564}.clue{display:none;background:#ffe1ad;padding:10px;border-radius:10px;margin-top:9px;font-size:13px;font-weight:bold}.ad.selected .clue{display:block}.badges{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:18px 0}.badge{background:white;border:3px solid #ebcd71;border-radius:16px;padding:14px;width:190px}.badge .seal{font-size:47px}.hidden{display:none}@media(max-width:760px){.top{height:auto;align-items:flex-start}.brand{font-size:19px}.layout{grid-template-columns:1fr;padding:10px}.mapwrap,.map{min-height:450px;height:450px}.sidebar{display:grid;grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.adgrid{grid-template-columns:1fr}.modal{padding:19px}.node{width:62px;height:62px;font-size:28px}.miner{font-size:42px}.stat{font-size:12px;padding:5px 7px}}@media(max-width:450px){.sidebar{display:block}.sidebar .card{margin-bottom:10px}.stats{justify-content:flex-end}.top{padding:8px}.brand{max-width:130px}.n3{top:23%}}
</style></head>
<body><main class="game"><header class="top"><div class="brand">⛏️ 礦坑<span>夢想家</span></div><div class="stats"><div class="stat">🪙 金幣 <span id="money">100</span></div><div class="stat">💡 防詐線索 <span id="clues">0</span>/4</div><div class="stat">📍 第 <span id="step">0</span>/4 關</div></div></header>
<div class="layout"><section class="mapwrap"><div class="map"><span class="cloud" style="left:12%;top:2%">☁</span><span class="cloud" style="right:8%;top:12%;font-size:44px">☁</span><div class="mountain m1"></div><div class="mountain m2"></div><div class="path"></div><div class="ground"></div><div class="track"></div><button class="node n0" data-stage="0" title="起點">🏠</button><button class="node n1 lock" data-stage="1" title="零用錢礦脈">💰</button><button class="node n2 lock" data-stage="2" title="理財偵探局">🔎</button><button class="node n3 lock" data-stage="3" title="投資岔路">📈</button><button class="node n4 lock" data-stage="4" title="夢想終點">🏆</button><div class="miner" id="miner">👷</div><div class="sign">點亮路線，挖出你的夢想！</div></div></section>
<aside class="sidebar"><div class="card"><div class="goalpic" id="goalEmoji">🎒</div><h2>我的夢想</h2><b id="goalName">尚未選擇</b><div class="progress"><i id="bar" style="width:0%"></i></div><small>存款：<b id="saved">0</b> / <span id="target">—</span> 金幣</small></div><div class="card tip"><b>礦坑小提醒</b><br>存錢不是把錢藏起來，而是先想清楚「我想完成什麼」！</div><div class="card"><h2>冒險指南</h2><small>依序點擊地圖上的發亮地點。每一關都有選擇與事件卡。</small><button class="btn alt" id="restart">重新開始</button></div></aside></div></main>
<div class="overlay" id="intro"><div class="modal"><div style="font-size:65px">⛏️✨</div><h1>歡迎來到夢想礦坑！</h1><p>你是一位小小礦工，要用聰明的理財決定，挖出自己想完成的夢想。<br>先選一個最想買的物品吧！</p><div class="choices" id="goalChoices"></div><p style="font-size:13px;color:#62717b">遊戲中沒有「賺最多」才是贏家；完成目標、守住荷包也很厲害。</p></div></div>
<div class="overlay hidden" id="event"><div class="modal" id="eventContent"></div></div>
<script>
const goals=[{name:'探險背包',emoji:'🎒',cost:160},{name:'生日禮物',emoji:'🎁',cost:220},{name:'腳踏車基金',emoji:'🚲',cost:280}];let state={goal:null,money:100,saved:0,stage:0,clues:0,detective:false};
const $=id=>document.getElementById(id);function save(){try{localStorage.mineDream=JSON.stringify(state)}catch(e){}}function update(){ $('money').textContent=state.money;$('clues').textContent=state.clues;$('step').textContent=state.stage;$('saved').textContent=state.saved;if(state.goal){$('goalName').textContent=state.goal.name;$('goalEmoji').textContent=state.goal.emoji;$('target').textContent=state.goal.cost;$('bar').style.width=Math.min(100,state.saved/state.goal.cost*100)+'%'}document.querySelectorAll('.node').forEach(n=>{let v=+n.dataset.stage;n.classList.toggle('lock',v>state.stage);n.classList.toggle('done',v<state.stage)});let poses=[['9%','57%'],['29%','44%'],['50%','56%'],['69%','38%'],['84%','53%']];$('miner').style.left=poses[state.stage][0];$('miner').style.top=poses[state.stage][1];save()}
function chooseGoal(g){state.goal=g;state.stage=1;$('intro').classList.add('hidden');update();showStart()};function show(html){$('eventContent').innerHTML=html;$('event').classList.remove('hidden')}function dismissEvent(){ $('event').classList.add('hidden');update() }
function showStart(){show(`<div style="font-size:55px">👷‍♀️</div><h1>出發囉，小小礦工！</h1><div class="dialogue"><b>礦坑嚮導阿金：</b>「你的目標是 <strong>${state.goal.name}</strong>，需要 ${state.goal.cost} 金幣。記得：每一枚金幣都要有任務！」</div><p>點地圖上的 💰，開始你的第一個理財決定。</p><button class="btn" onclick="dismissEvent()">我要出發！</button>`) }
function stage1(){show(`<div style="font-size:56px">💰</div><h1>零用錢礦脈</h1><div class="dialogue"><b>阿金：</b>「你拿到 60 金幣零用錢。你想怎麼做？」</div><div class="choices"><button class="choice" onclick="decision(40,'你先把 40 金幣放進夢想罐，真有方向！')"><span class="emoji">🐷</span>先存 40<br><small>目標優先</small></button><button class="choice" onclick="decision(15,'買點心也可以，但你記得先留一部分給夢想。')"><span class="emoji">🍪</span>買點心再存 15<br><small>享受也要有界線</small></button><button class="choice" onclick="decision(0,'全部花掉了。沒關係，下一次可試試先存再花！')"><span class="emoji">🎮</span>全部花掉<br><small>下次再說</small></button></div>`) }function decision(n,msg){state.saved+=n;state.money+=60-n;state.stage=2;show(`<div style="font-size:55px">⛏️</div><h1>你做了選擇！</h1><p>${msg}</p><div class="dialogue"><b>理財小筆記：</b>把錢分成「想存的」和「可以花的」，不是不能買，而是讓自己有選擇權。</div><button class="btn" onclick="dismissEvent()">前往理財偵探局</button>`)}
function stage2(){show(`<div style="font-size:55px">🔎</div><h1>理財偵探任務</h1><p>市場裡出現一些投資廣告。<b>點出你覺得可疑的廣告</b>，再交出偵查報告！</p><div class="adgrid"><div class="ad" onclick="this.classList.toggle('selected')"><h3>🌟 穩穩成長存錢罐</h3><p>每月存一點，慢慢完成夢想；可查看規則與費用。</p><div class="clue">這則有清楚說明，暫時沒有詐騙紅旗。</div></div><div class="ad" data-bad="1" onclick="this.classList.toggle('selected')"><h3>🚀 一週翻倍計畫</h3><p>保證 100% 獲利！錯過今天就沒機會。</p><div class="clue">⚠️ 「保證獲利」＋催你馬上決定，是重要紅旗！</div></div><div class="ad" data-bad="1" onclick="this.classList.toggle('selected')"><h3>💎 神秘礦石內線</h3><p>完全沒有風險，先匯款才能加入，資金用途保密。</p><div class="clue">⚠️ 無風險、急著匯款、不說用途，全都很可疑！</div></div><div class="ad" onclick="this.classList.toggle('selected')"><h3>🏦 銀行小小儲蓄帳戶</h3><p>由家長陪同開戶，利息和限制都公開說明。</p><div class="clue">資訊透明，也可以請大人一起查證。</div></div></div><button class="btn" onclick="checkAds()">交出偵查報告</button>`) }function checkAds(){let sels=[...document.querySelectorAll('.ad.selected')];let bad=sels.filter(x=>x.dataset.bad).length,good=sels.filter(x=>!x.dataset.bad).length;if(bad===2&&good===0){state.clues=4;state.detective=true;state.stage=3;show(`<div style="font-size:60px">🕵️‍♀️</div><h1>偵查成功！</h1><p>你找出了所有可疑廣告，得到 4 枚防詐線索！</p><div class="dialogue"><b>防詐口訣：</b>保證獲利先懷疑；催我匯款先停下；用途不明要查證。遇到投資資訊，記得找家長或可信任的大人一起確認。</div><button class="btn" onclick="dismissEvent()">前往投資岔路</button>`)}else{show(`<div style="font-size:50px">🧐</div><h1>再想一想！</h1><p>可疑訊息通常會「保證賺錢、說沒風險、催你匯款，或不講錢要做什麼」。回去看看廣告吧。</p><button class="btn" onclick="stage2()">回到廣告牆</button>`)}}
function stage3(){show(`<div style="font-size:58px">📈</div><h1>投資岔路</h1><div class="dialogue"><b>阿金：</b>「有人說：把所有金幣都放同一個神秘礦坑，明天保證變兩倍！」</div><p>你會怎麼做？</p><div class="choices"><button class="choice" onclick="invest('safe')"><span class="emoji">🧺</span>分配存錢與日常花費<br><small>先問清楚再決定</small></button><button class="choice" onclick="invest('risk')"><span class="emoji">🎲</span>全部押進去<br><small>聽說會翻倍</small></button><button class="choice" onclick="invest('ask')"><span class="emoji">🧑‍🧑‍🧒</span>先和大人討論<br><small>多一個人查證</small></button></div>`) }function invest(t){let n=t==='safe'?70:t==='ask'?55:10;state.saved+=n;state.money+=n;state.stage=4;let msg=t==='risk'?'幸好阿金提醒你，神秘礦坑沒有透明資訊，先不投入才安全！':t==='safe'?'你把錢分配得很有想法，穩穩把金幣放進夢想罐。':'你願意先討論與查證，這是很成熟的投資習慣！';show(`<div style="font-size:58px">🧭</div><h1>安全通過岔路！</h1><p>${msg}</p><p>你得到 <b>${n} 金幣</b> 的夢想進度。</p><button class="btn" onclick="dismissEvent()">前往夢想終點</button>`)}
function stage4(){let need=Math.max(0,state.goal.cost-state.saved);let possible=state.money>=need;if(possible)state.saved+=need;show(`<div style="font-size:62px">🏆</div><h1>${possible?'夢想達成！':'終點前的整理'}</h1><p>${possible?`你從錢包拿出 ${need} 金幣，完成了「${state.goal.name}」！`:`還差 ${need} 金幣才能達成目標，但你已經學會怎麼規劃下一次零用錢了。`}</p><div class="badges">${possible?'<div class="badge"><div class="seal">🏅</div><b>夢想規劃師</b><br><small>完成儲蓄目標</small></div>':''}${state.detective?'<div class="badge"><div class="seal">🛡️</div><b>防詐偵探</b><br><small>找出可疑投資訊息</small></div>':''}</div><div class="dialogue"><b>阿金的結語：</b>「真正厲害的投資，是先保護好自己，再一步一步讓夢想發亮。」</div><button class="btn" onclick="restart()">再玩一次</button>`) ;update()}
function play(i){if(i!==state.stage||!state.goal)return;if(i===0)showStart();if(i===1)stage1();if(i===2)stage2();if(i===3)stage3();if(i===4)stage4()}document.querySelectorAll('.node').forEach(n=>n.onclick=()=>play(+n.dataset.stage));function restart(){state={goal:null,money:100,saved:0,stage:0,clues:0,detective:false};$('event').classList.add('hidden');$('intro').classList.remove('hidden');renderGoals();update()}function renderGoals(){$('goalChoices').innerHTML=goals.map((g,i)=>`<button class="choice" onclick="chooseGoal(goals[${i}])"><span class="emoji">${g.emoji}</span>${g.name}<br><small>${g.cost} 金幣</small></button>`).join('')} $('restart').onclick=restart;renderGoals();update();
</script></body></html>
