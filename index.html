<style>

</style><main><header><b>小小金錢獸</b><span id="stats">0 分　｜　鑰匙 0 / 2</span></header><div class="hero"><img id="art" src="a.jpg" alt="抱著葉紋金幣的飛鼠，在雪地市集等你"><div class="story"><small id="chapter">第一關　／　雪地市集</small><h1 id="title">出發前的錢袋</h1><p id="line">「借我一雙眼睛！明天搭車的錢，也要算進去。」</p></div></div><nav aria-label="比較美術風格"><small>切換美術</small><button data-art="a" aria-pressed="true">雪夜燈火</button><button data-art="b" aria-pressed="false">晴空競技場</button><button data-art="c" aria-pressed="false">微縮雪村</button></nav>
<article><section id="l1"><h2>哪一袋能安心出發？</h2><p>你有 100 枚金幣。今天要買 35 元午餐，明天的車票要留 25 元。挑一個兩天都夠用的錢袋。</p><fieldset><legend>選一個錢袋</legend><div class="plans"><label><input type="radio" name="bag" value="0"><strong>煙火袋</strong><small>午餐 35 ＋ 煙火 65</small></label><label><input type="radio" name="bag" value="1"><strong>旅行袋</strong><small>午餐 35 ＋ 車票 25 ＋ 貼紙 15</small></label><label><input type="radio" name="bag" value="2"><strong>雪橇袋</strong><small>午餐 35 ＋ 車票 25 ＋ 雪橇 55</small></label></div></fieldset></section>
<section id="l2" hidden><h2>替市集的兩家攤位備貨</h2><p>你有 100 枚金幣，其中 40 枚是明天的餐費。至少留足餐費，再把投資金分給熱湯攤與冰果攤。天氣會改變兩攤生意，兩攤也可能一起虧錢。</p><div class="ranges"></div><p id="sum"></p></section>
<section id="end" hidden><h2>兩把鑰匙，兩個新本領</h2><p id="report"></p></section>
<div class="row"><button class="gold" id="act">確認錢袋</button><img class="award" src="quest-key.png" alt="獲得葉輪黃銅鑰匙" hidden><span role="status" class="notice" id="msg"></span></div></article></main><script>
const $=s=>document.querySelector(s),styles=[...document.querySelectorAll('[data-art]')];
styles.forEach(b=>b.onclick=()=>{styles.forEach(i=>i.setAttribute('aria-pressed',String(b===i)));$('#art').src=b.dataset.art+'.jpg'});
const values=[0,0,0],points=[0,0],miss=[0,0];let level=0,passed=false;
['餐費袋','熱湯攤','冰果攤'].forEach((s,i)=>{let label=document.createElement('label');label.innerHTML=s+' <input type="range" min="0" max="100" step="10" value="0"><output>0</output>';$('.ranges').append(label);label.querySelector('input').oninput=e=>{values[i]=+e.target.value;label.querySelector('output').textContent=values[i];$('#sum').textContent='已安排 '+values.reduce((a,b)=>a+b)+' / 100 枚'}});
$('#sum').textContent='已安排 0 / 100 枚';
$('#act').onclick=()=>{if(level===2){location.reload();return}if(passed){$('#l'+(level+1)).hidden=true;level++;passed=false;$('#msg').textContent='';$('.award').hidden=true;if(level===1){$('#l2').hidden=false;$('#title').textContent='天氣多變的市集';$('#chapter').textContent='第二關　／　市集投資';$('#line').textContent='「下雪時，兩家攤位的生意會一樣嗎？」';$('#act').textContent='確認分配'}else{$('#end').hidden=false;$('#title').textContent='寶庫開啟';$('#chapter').textContent='闖關成果';$('#line').textContent='「我會先留餐費，也會分開安排投資！」';$('#report').textContent=['預算','投資分配'].map((s,i)=>s+' '+points[i]+' / 50 分（'+(miss[i]?'調整 '+miss[i]+' 次後過關':'第一次答對')+'）').join('。')+'。';$('#act').textContent='再挑戰一次'}return}
let error='';if(level===0){const v=$('input[name=bag]:checked');if(!v){$('#msg').textContent='先選一個錢袋。';return}error=['明天還需要 25 元車票，這袋今天就用完了。','','加起來是 115 元，超過預算 15 元。'][v.value]}else{let total=values.reduce((a,b)=>a+b);error=total!==100?'把 100 枚分完，再檢查總額。':values[0]<40?'餐費至少需要 40 枚。':Math.min(values[1],values[2])===0?'兩家攤位都要分到投資金。':''}if(error){miss[level]++;$('#msg').textContent=error;return}
passed=true;points[level]=Math.max(30,50-5*miss[level]);document.querySelectorAll('#l'+(level+1)+' input').forEach(i=>i.disabled=true);$('.award').hidden=false;$('#stats').textContent=points.reduce((a,b)=>a+b)+' 分　｜　鑰匙 '+(level+1)+' / 2';$('#msg').textContent='取得鑰匙！本關 '+points[level]+' / 50 分。';$('#act').textContent=level?'開啟寶庫':'前往第二關'};
</script></html>
